packages:
  - 'apps/*'
  - 'packages/*'
  # `tools/simulator` è il simulatore di flotta di M7 (MILESTONES.md §M7), che vive qui perché non
  # è dominio: è il fornitore dall'altra parte di ExternalServicesPort. Il glob prende solo le
  # cartelle di tools/ che hanno un package.json, quindi gli script di harness restano fuori.
  - 'tools/*'

# pnpm chiede esplicitamente quali pacchetti possono eseguire script di installazione.
# esbuild e unrs-resolver ne hanno bisogno: scaricano/collegano il binario nativo usato
# rispettivamente da Vite e da dependency-cruiser. @scarf/scarf invia solo telemetria.
#
# cpu-features, protobufjs e ssh2 arrivano da `testcontainers` (che parla con Docker): i loro
# script compilano acceleratori nativi opzionali. Senza, la libreria funziona lo stesso in pura
# JavaScript — e una compilazione nativa in più è una cosa in più che può rompersi in CI.
#
# bcrypt (M1b) è l'eccezione: il suo binding nativo non è opzionale, non esiste un ripiego in pura
# JavaScript, e senza lo script di installazione `require('bcrypt')` fallisce all'avvio. Lo script
# scarica il binario già compilato per la piattaforma, quindi non serve un compilatore né in
# locale né in CI.
allowBuilds:
  '@scarf/scarf': false
  bcrypt: true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true
